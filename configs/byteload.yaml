server:
  port: "9001"
  host: "0.0.0.0"

logging:
  level: "info"
  format: "json"

metrics:
  enabled: true
  endpoint: "/metrics"

security:
  basic_auth:
    enabled: false
    username: "metrics"
    password: "change-me-in-production"

services:
  default:
    - "nginx"
    - "mysql"
    - "php-fpm: master process"
    - "php-fpm: pool valet"
    - "/opt/homebrew/opt/php@7.4/sbin/php-fpm"